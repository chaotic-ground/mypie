name: Release

# Creates a GitHub Release (auto-generated notes) when a version tag is
# pushed. The app itself is installed by building from source — see README.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9 # v3.0.1
        with:
          generate_release_notes: true
          body: |
            소스에서 빌드해 설치합니다. 데스크톱 앱 빌드 방법은 [README](https://github.com/chaotic-ground/mypie#readme)를 참고하세요.
