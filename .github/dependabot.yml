version: 2
updates:
  # Track upstream typie (upstream/typie submodule). Bumps land as PRs that
  # run CI, so the drift-guard tests gate any contract-breaking change.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "submodule"
    labels:
      - "dependencies"
      - "upstream"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # editor-poc frontend (Vite / Svelte / Tauri CLI / es-hangul).
  - package-ecosystem: "npm"
    directory: "/apps/editor-poc"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"

  # editor-poc desktop shell (Tauri / Rust crates).
  - package-ecosystem: "cargo"
    directory: "/apps/editor-poc/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns:
          - "*"
